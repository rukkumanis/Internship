<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Technical Skills</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }
    body {
      background-color: #0F172A;
      color: white;
      padding: 40px;
    }
    h1 {
      text-align: center;
      color: #22D3EE;
      margin-bottom: 10px;
    }
    p {
      text-align: center;
      color: #CBD5E1;
      margin-bottom: 40px;
    }
    .skills-container {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }
    .skill-box {
      background-color: #1E293B;
      padding: 20px;
      border-radius: 10px;
    }
    .skill-box h2 {
      color: #22D3EE;
      margin-bottom: 15px;
    }
    .tags span {
      display: inline-block;
      background-color: #334155;
      color: #22D3EE;
      padding: 8px 15px;
      margin: 5px;
      border-radius: 5px;
    }
    @media(max-width:768px) {
      .skills-container {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <h1>Skills & Expertise</h1>
  <h1>Technical Skills</h1>
  <p>Technologies and tools I use for web development.</p>
  <div class="skills-container">
    <div class="skill-box">
      <h2>Frontend</h2>
      <div class="tags">
        <span>HTML</span>
        <span>CSS</span>
        <span>JavaScript</span>
      </div>
    </div>
    <div class="skill-box">
      <h2>Backend</h2>
      <div class="tags">
        <span>PHP (Basic)</span>
        <span>MySQL</span>
      </div>
    </div>
    <div class="skill-box">
      <h2>Design Tools</h2>
      <div class="tags">
        <span>Canva</span>
        <span>Figma</span>
        <span>Photoshop</span>
      </div>
    </div>
    <div class="skill-box">
      <h2>Dev Tools</h2>
      <div class="tags">
        <span>GitHub</span>
        <span>VS Code</span>
      </div>
    </div>
  </div>
</body>
</html>
