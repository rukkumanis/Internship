<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Me</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: black;
            color: white;
            padding: 40px;
        }
        h1 {
            text-align: center;
            margin-bottom: 40px;
            font-size: 50px;
        }
        .container {
            display: flex;
            gap: 30px;
        }
        .image-box {
            width: 40%;
        }
        .image-box img {
            width: 100%;
            border-radius: 10px;
            border: 4px solid orange;
        }
        .content {
            width: 60%;
        }
        .content p {
            line-height: 30px;
            margin-bottom: 30px;
        }
        .skills {
            margin-top: 20px;
        }
        .skills h3 {
            color: orange;
            margin-top: 15px;
            margin-bottom: 10px;
        }
        .skills p {
            color: lightgray;
        }
        @media(max-width:768px) {
            .container {
                flex-direction: column;
            }
            .image-box,
            .content {
                width: 100%;
            }
            h1 {
                font-size: 35px;
            }
        }
    </style>
</head>
<body>
    <h1>About Me</h1>
    <div class="container">
        <div class="image-box">
            <img src="your-image.jpg" alt="Profile Image">
        </div>
        <div class="content">
            <p>
                I am a technology enthusiast with a passion for web development.
                I enjoy creating responsive websites and learning new technologies.
            </p>
            <div class="skills">
                <h3>Languages</h3>
                <p>English, Tamil</p>
                <h3>Front-End</h3>
                <p>HTML, CSS, JavaScript</p>
                <h3>Back-End</h3>
                <p>PHP, MySQL</p>
                <h3>Tools</h3>
                <p>VS Code, GitHub, Canva</p>
                <h3>Education</h3>
                <p>B.Sc Information Technology</p>
            </div>
        </div>
    </div>
</body>
</html>
