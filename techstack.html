<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Tech Stack</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #0F172A;
            color: white;
            padding: 40px;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 45px;
        }
        .tech-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }
        .card {
            width: 180px;
            background-color: #1E293B;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }
        .icon {
            font-size: 50px;
            margin-bottom: 10px;
        }
        .card h3 {
            color: #38BDF8;
        }
        @media(max-width:768px) {
            h1 {
                font-size: 35px;
            }
            .card {
                width: 140px;
            }
        }
    </style>
</head>
<body>
    <h1>My Tech Stack</h1>
    <div class="tech-container">
        <div class="card">
            <div class="icon">🌐</div>
            <h3>HTML</h3>
        </div>
        <div class="card">
            <div class="icon">🎨</div>
            <h3>CSS</h3>
        </div>
        <div class="card">
            <div class="icon">⚡</div>
            <h3>JavaScript</h3>
        </div>
        <div class="card">
            <div class="icon">🐘</div>
            <h3>PHP</h3>
        </div>
        <div class="card">
            <div class="icon">🗄️</div>
            <h3>MySQL</h3>
        </div>
        <div class="card">
            <div class="icon">💻</div>
            <h3>VS Code</h3>
        </div>
        <div class="card">
            <div class="icon">🐙</div>
            <h3>GitHub</h3>
        </div>
        <div class="card">
            <div class="icon">🎭</div>
            <h3>Canva</h3>
        </div>
    </div>
</body>
</html>
