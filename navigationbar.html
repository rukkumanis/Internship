<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation Bar</title>
    <style>
        nav{
            background-color: #581c87;
            padding: 10px;
        }
        nav a{
            color: aliceblue;
            margin: 10px;
            padding: 10px;
            text-decoration: none;
        }
        nav a:hover{
            background-color: #ec4899;
            color: white;
        }
        .content{
            padding: 40px;
        }
    </style>
</head>
<body bgcolor="#fdf2f8">
    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </nav>
    <div class="content">
        <h1>Welcome to My Website</h1>
        <p>This is a simple navigation bar design using HTML and CSS. When you move the mouse over the navigation links, the background color changes with a smooth hover effect.</p>
    </div>
</body>
</html>
