<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dropdown Menu</title>
    <style>
         .menu{
            display: none;
            background-color: lightgray;
            width: 100px;
            padding: 10px;
        }

        .dropdown:hover .menu{
            display: block;
        }
    </style>
</head>
<body>
    <div class="dropdown">
        Menu
        <div class="menu">
            <p>Item 1</p>
            <p>Item 2</p>
        </div>
    </div>
</body>
</html>
